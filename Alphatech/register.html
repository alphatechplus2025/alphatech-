<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Alpha Tech+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Inter", sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }
    .gradient-text {
      background: linear-gradient(135deg, #00adb5 0%, #00fff5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-card {
      background: rgba(57, 62, 70, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 173, 181, 0.2);
      border-radius: 20px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00adb5 0%, #00fff5 100%);
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 173, 181, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 173, 181, 0.6);
    }
    input:focus {
      outline: none;
      border-color: #00adb5;
      box-shadow: 0 0 0 3px rgba(0, 173, 181, 0.1);
    }
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 8px;
      color: white;
      z-index: 1000;
      opacity: 0;
      transform: translateX(400px);
      transition: all 0.3s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }
    .toast.success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    .toast.error {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="text-center mb-8">
      <a
        href="../index.html"
        class="inline-flex items-center text-2xl font-black gradient-text mb-4"
      >
        <i class="fas fa-bolt text-cyan-500 mr-2"></i>
        ALPHA TECH+
      </a>
      <h1 class="text-3xl font-bold text-white mb-2">Create Account</h1>
      <p class="text-gray-400">Join Alpha Tech+ Company Portal</p>
    </div>

    <div class="login-card p-8 rounded-2xl shadow-2xl">
      <form id="register-form" class="space-y-6" action="register.php">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2"
            ><i class="fas fa-user mr-2 text-cyan-500"></i>Full Name</label
          >
          <input
            type="text"
            id="fullName"
            name="fullName"
            required
            placeholder="Enter your full name"
            class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2"
            ><i class="fas fa-envelope mr-2 text-cyan-500"></i>Email
            Address</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your company email"
            class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2"
            ><i class="fas fa-building mr-2 text-cyan-500"></i>Company ID</label
          >
          <input
            type="text"
            id="companyId"
            name="companyId"
            required
            placeholder="Enter your Company ID"
            class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2"
            ><i class="fas fa-lock mr-2 text-cyan-500"></i>Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Create a strong password"
            class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2"
            ><i class="fas fa-user-shield mr-2 text-cyan-500"></i>Role</label
          >
          <select
            id="role"
            name="role"
            required
            class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
          >
            <option value="">Select Role</option>
            <option value="admin">Admin</option>
            <option value="staff">Staff</option>
            <option value="manager">Manager</option>
          </select>
        </div>

        <button
          type="submit"
          id="register-btn"
          class="btn-primary w-full py-4 rounded-lg font-semibold text-black text-lg"
        >
          <i class="fas fa-user-plus mr-2"></i>Create Account
        </button>
      </form>

      <div class="mt-6 text-center border-t border-gray-700 pt-6">
        <p class="text-gray-400 text-sm">
          Already have an account?
          <a href="login.html" class="text-cyan-500 hover:text-cyan-400"
            >Login</a
          >
        </p>
      </div>
    </div>
  </div>

  <script>
    function showToast(message, type = "success") {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 4000);
    }

    document
      .getElementById("register-form")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("register-btn");
        btn.disabled = true;
        btn.innerHTML =
          '<i class="fas fa-spinner fa-spin mr-2"></i>Creating Account...';

        const formData = new FormData(e.target);

        try {
          const res = await fetch("register.php", {
            method: "POST",
            body: formData,
          });
          const result = await res.json();

          if (result.success) {
            showToast(result.message, "success");
            setTimeout(() => (window.location.href = "login.html"), 2000);
          } else {
            showToast(result.message, "error");
          }
        } catch (err) {
          showToast("Network error. Try again.", "error");
        } finally {
          btn.disabled = false;
          btn.innerHTML =
            '<i class="fas fa-user-plus mr-2"></i>Create Account';
        }
      });
  </script>
</body>
</html>
