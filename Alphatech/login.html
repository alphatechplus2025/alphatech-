<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Alpha Tech+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #FFFFFF;
            min-height: 100vh;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #00ADB5 0%, #00FFF5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .login-card {
            background: rgba(57, 62, 70, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 173, 181, 0.2);
            border-radius: 20px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00ADB5 0%, #00FFF5 100%);
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 173, 181, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 173, 181, 0.6);
        }
        
        input:focus {
            outline: none;
            border-color: #00ADB5;
            box-shadow: 0 0 0 3px rgba(0, 173, 181, 0.1);
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            z-index: 1000;
            opacity: 0;
            transform: translateX(400px);
            transition: all 0.3s ease;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }
        
        .toast.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .toast.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Background Pattern -->
    <div class="fixed inset-0 hero-pattern opacity-10"></div>
    
    <!-- Login Container -->
    <div class="w-full max-w-md relative z-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-flex items-center text-2xl font-black gradient-text mb-4">
                <i class="fas fa-bolt text-cyan-500 mr-2"></i>
                ALPHA TECH+
            </a>
            <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-gray-400">Sign in to your Alpha Tech+ account</p>
        </div>

        <!-- Login Card -->
        <div class="login-card p-8 rounded-2xl shadow-2xl">
            <form id="login-form" class="space-y-6" action="login.php">
                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                        <i class="fas fa-envelope mr-2 text-cyan-500"></i>
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        placeholder="Enter your company email"
                        class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 transition focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                    >
                    <p class="text-xs text-gray-500 mt-1">Use your official company email address</p>
                </div>

                <!-- Company ID Field -->
                <div>
                    <label for="companyId" class="block text-sm font-medium text-gray-300 mb-2">
                        <i class="fas fa-building mr-2 text-cyan-500"></i>
                        Company ID
                    </label>
                    <input 
                        type="text" 
                        id="companyId" 
                        name="companyId" 
                        required
                        placeholder="Enter your Company ID"
                        class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 transition focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                    >
                    <p class="text-xs text-gray-500 mt-1">Provided by your system administrator</p>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                        <i class="fas fa-lock mr-2 text-cyan-500"></i>
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        placeholder="Enter your password"
                        class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 transition focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="login-btn"
                    class="btn-primary w-full py-4 rounded-lg font-semibold text-black text-lg transition"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Sign In to Dashboard
                </button>
            </form>

        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-gray-500 text-sm">
                &copy; 2025 Alpha Tech+. All rights reserved.
            </p>
        </div>
    </div>

    <script>
        // Toast notification function
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        // Form submission
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const companyId = document.getElementById('companyId').value;
            const password = document.getElementById('password').value;
            
            // Basic validation
            if (!email || !companyId || !password) {
                showToast('Please fill in all fields', 'error');
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showToast('Please enter a valid email address', 'error');
                return;
            }
            
            // Company ID validation (basic)
            if (companyId.length < 3) {
                showToast('Company ID must be at least 3 characters', 'error');
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing In...';

            try {
                // Create form data
                const formData = new FormData();
                formData.append('email', email);
                formData.append('companyId', companyId);
                formData.append('password', password);
                
                // Send login request
                const response = await fetch('login.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('Successfully signed in! Redirecting...', 'success');
                    
                    // Redirect to admin page
                    setTimeout(() => {
                        window.location.href = result.redirect || 'admin.html';
                    }, 1500);
                } else {
                    showToast(result.message || 'Login failed. Please check your credentials.', 'error');
                }
                
            } catch (error) {
                showToast('Network error. Please check your connection and try again.', 'error');
                console.error('Login error:', error);
            } finally {
                // Reset button
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Sign In to Dashboard';
            }
        });

        // Enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // Auto-focus email field on page load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('email').focus();
        });
    </script>
</body>
</html>
